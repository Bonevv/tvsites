plugins {
    id 'com.android.application'
}

// Номерът на версията идва от GitHub (номер на компилирането), за да расте при всяко качване.
def verCode = (project.findProperty('verCode') ?: '2').toString().toInteger()

android {
    namespace 'com.example.tvsites'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.tvsites"
        minSdk 21
        targetSdk 34
        versionCode verCode
        versionName "2.${verCode}".toString()
    }

    signingConfigs {
        release {
            // Постоянният ключ идва от тайните в GitHub (виж main.yml).
            def ksPath = System.getenv('KEYSTORE_FILE')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Без постоянен ключ (например при локално компилиране) се ползва debug ключът.
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Проверките на lint не трябва да спират компилирането на APK.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // ExoPlayer: родният плеър за директно пускане на видео потоци
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    // FileProvider за инсталиране на свалената нова версия
    implementation 'androidx.core:core:1.12.0'
    // Чете .rar архиви със субтитри (Subs.sab.bz често ги ползва)
    implementation 'com.github.junrar:junrar:7.5.5'
}
